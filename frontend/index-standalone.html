<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Jarvis Ecosystem</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --bg: #0A0A0F;
            --copper: #B87333;
            --brass: #D4AF37;
            --cyan: #00E5FF;
            --orange: #FF6B35;
            --pink: #FF1493;
            --green: #39FF14;
            --text: #F5F5DC;
            --text-dim: #8B7355;
            --panel: #1A1A2E;
            --panel-light: #252540;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            overflow: hidden;
        }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: var(--panel);
            border-bottom: 2px solid var(--copper);
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
        }
        
        .header h1 {
            font-size: 18px;
            color: var(--cyan);
            text-shadow: 0 0 10px var(--cyan);
        }
        
        .status {
            font-size: 12px;
            padding: 5px 10px;
            border-radius: 20px;
            background: var(--panel-light);
            color: var(--green);
        }
        
        .container {
            margin-top: 60px;
            height: calc(100vh - 60px);
            position: relative;
            overflow: hidden;
        }
        
        .ecosystem {
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 50%, #1A1A2E 0%, #0A0A0F 100%);
            position: relative;
        }
        
        .agent {
            position: absolute;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            cursor: pointer;
            transition: all 0.3s;
            border: 3px solid var(--cyan);
            box-shadow: 0 0 20px rgba(0, 229, 255, 0.3);
            animation: float 3s ease-in-out infinite;
        }
        
        .agent:hover {
            transform: scale(1.2);
            box-shadow: 0 0 30px rgba(0, 229, 255, 0.6);
        }
        
        .agent.working {
            border-color: var(--green);
            box-shadow: 0 0 30px rgba(57, 255, 20, 0.6);
            animation: work-pulse 1s ease-in-out infinite;
        }
        
        .agent-label {
            position: absolute;
            bottom: -30px;
            left: 50%;
            transform: translateX(-50%);
            white-space: nowrap;
            background: var(--panel);
            border: 2px solid var(--cyan);
            border-radius: 20px;
            padding: 5px 10px;
            font-size: 11px;
            color: var(--cyan);
        }
        
        .bubble {
            position: absolute;
            background: var(--panel);
            border: 2px solid var(--cyan);
            border-radius: 20px;
            padding: 10px 15px;
            max-width: 200px;
            font-size: 12px;
            color: var(--text);
            box-shadow: 0 0 20px rgba(0, 229, 255, 0.3);
            animation: slide-up 0.3s ease-out;
            pointer-events: none;
        }
        
        .bubble::before {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 20px;
            border-width: 10px 10px 0;
            border-style: solid;
            border-color: var(--cyan) transparent transparent;
        }
        
        .controls {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            z-index: 50;
        }
        
        .btn {
            padding: 12px 20px;
            border: none;
            border-radius: 25px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .btn-primary {
            background: var(--cyan);
            color: var(--bg);
        }
        
        .btn-primary:hover {
            background: #00FFFF;
            box-shadow: 0 0 20px var(--cyan);
        }
        
        .btn-secondary {
            background: var(--panel);
            color: var(--text);
            border: 2px solid var(--copper);
        }
        
        .btn-secondary:hover {
            background: var(--panel-light);
            border-color: var(--brass);
        }
        
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 200;
        }
        
        .modal.active {
            display: flex;
        }
        
        .modal-content {
            background: var(--panel);
            border: 2px solid var(--cyan);
            border-radius: 20px;
            padding: 25px;
            max-width: 90%;
            width: 400px;
        }
        
        .modal h2 {
            color: var(--cyan);
            margin-bottom: 15px;
            text-align: center;
        }
        
        .modal input {
            width: 100%;
            padding: 12px;
            background: var(--bg);
            border: 2px solid var(--copper);
            border-radius: 10px;
            color: var(--text);
            margin-bottom: 15px;
        }
        
        .modal-actions {
            display: flex;
            gap: 10px;
        }
        
        .modal-actions button {
            flex: 1;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        
        @keyframes work-pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
        
        @keyframes slide-up {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🌐 Écosystème Jarvis</h1>
        <div class="status">🟢 En ligne</div>
    </div>
    
    <div class="container">
        <div class="ecosystem" id="ecosystem">
            <!-- Agents will be added here -->
        </div>
    </div>
    
    <div class="controls">
        <button class="btn btn-primary" onclick="openMissionModal()">➕ Mission</button>
        <button class="btn btn-secondary" onclick="showStatus()">📊 Statut</button>
        <button class="btn btn-secondary" onclick="showHistory()">📜 Historique</button>
    </div>
    
    <div class="modal" id="mission-modal">
        <div class="modal-content">
            <h2>Donner une mission</h2>
            <input type="text" id="mission-input" placeholder="Ex: Trouve 3 niches rentables sur Etsy">
            <div class="modal-actions">
                <button class="btn btn-primary" onclick="sendMission()">Envoyer</button>
                <button class="btn btn-secondary" onclick="closeMissionModal()">Annuler</button>
            </div>
        </div>
    </div>
    
    <script>
        const agents = [
            { id: 'robot', name: 'Robot', role: 'Chercheur', emoji: '🤖', color: '#B87333', x: 150, y: 200, status: 'idle', task: null },
            { id: 'gobelin', name: 'Gobelin', role: 'Rédacteur', emoji: '👺', color: '#39FF14', x: 350, y: 200, status: 'idle', task: null },
            { id: 'serpent', name: 'Serpent', role: 'Analyste', emoji: '🐍', color: '#FF1493', x: 550, y: 200, status: 'idle', task: null }
        ];
        
        let bubbles = [];
        
        function init() {
            renderAgents();
            startSimulation();
        }
        
        function renderAgents() {
            const container = document.getElementById('ecosystem');
            container.innerHTML = '';
            
            agents.forEach(agent => {
                const el = document.createElement('div');
                el.className = `agent ${agent.status}`;
                el.style.left = `${agent.x}px`;
                el.style.top = `${agent.y}px`;
                el.style.background = `radial-gradient(circle, ${agent.color}40, ${agent.color}20)`;
                el.innerHTML = `
                    ${agent.emoji}
                    <div class="agent-label">${agent.name}</div>
                `;
                el.onclick = () => showAgentDetails(agent);
                container.appendChild(el);
            });
        }
        
        function startSimulation() {
            setInterval(() => {
                const randomAgent = agents[Math.floor(Math.random() * agents.length)];
                
                if (randomAgent.status === 'idle') {
                    const messages = [
                        '🔍 Recherche de nouvelles opportunités...',
                        '📊 Analyse des tendances du marché...',
                        '💡 Idée trouvée: Produits éco-responsables',
                        '📝 Rédaction de descriptions produits...',
                        '🎯 Cible identifiée: Déco scandinave',
                        '💰 Potentiel de revenu estimé: +25%'
                    ];
                    
                    addBubble(randomAgent, messages[Math.floor(Math.random() * messages.length)]);
                }
            }, 3000);
        }
        
        function addBubble(agent, message) {
            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            bubble.style.left = `${agent.x - 50}px`;
            bubble.style.top = `${agent.y - 80}px`;
            bubble.textContent = message;
            
            document.getElementById('ecosystem').appendChild(bubble);
            
            setTimeout(() => {
                bubble.style.opacity = '0';
                bubble.style.transition = 'opacity 0.5s';
                setTimeout(() => bubble.remove(), 500);
            }, 3000);
        }
        
        function openMissionModal() {
            document.getElementById('mission-modal').classList.add('active');
        }
        
        function closeMissionModal() {
            document.getElementById('mission-modal').classList.remove('active');
        }
        
        function sendMission() {
            const input = document.getElementById('mission-input');
            const mission = input.value.trim();
            
            if (!mission) return;
            
            const agent = agents[Math.floor(Math.random() * agents.length)];
            agent.status = 'working';
            agent.task = mission;
            
            addBubble(agent, `📋 Mission: ${mission}`);
            renderAgents();
            
            input.value = '';
            closeMissionModal();
            
            setTimeout(() => {
                agent.status = 'idle';
                agent.task = null;
                addBubble(agent, '✅ Mission terminée!');
                renderAgents();
            }, 5000);
        }
        
        function showAgentDetails(agent) {
            const details = `
                ${agent.emoji} ${agent.name}
                
Rôle: ${agent.role}
Statut: ${agent.status === 'working' ? '🟢 Au travail' : '⚪ Inactif'}
${agent.task ? `Tâche: ${agent.task}` : ''}
            `;
            alert(details);
        }
        
        function showStatus() {
            const status = agents.map(a => 
                `${a.emoji} ${a.name}: ${a.status === 'working' ? '🟢' : '⚪'} ${a.task || 'Inactif'}`
            ).join('\n');
            alert(`📊 Statut des agents\n\n${status}`);
        }
        
        function showHistory() {
            alert('📜 Historique\n\nLes agents travaillent en temps réel.');
        }
        
        window.addEventListener('load', init);
    </script>
</body>
</html>
